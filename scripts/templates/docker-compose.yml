services:
  wk-redis:
    image: redis:latest
    restart: always
    networks:
      - ${NETWORKS}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: none
  wk-postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - ${NETWORKS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d outline"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: none
##BEGIN MINIO
  wk-minio:
    image: minio/minio:${MINIO_VERSION}
    volumes:
      - ./data/minio_root:/minio_root:z
      - ./data/certs:/root/.minio/certs:z
    command: "minio server /minio_root"
    env_file:
      - ./env.minio
    restart: always
    networks:
      - ${NETWORKS}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: none
  wk-createbuckets:
    image: minio/mc:${MINIO_MC_VERSION}
    depends_on:
      wk-minio:
        condition: service_healthy
    env_file:
      - ./env.minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://wk-minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb minio/outline-bucket;
      /usr/bin/mc anonymous set download minio/outline-bucket;
      exit 0;
      "
    networks:
      - ${NETWORKS}
    logging:
      driver: none
##END
  wk-outline:
    image: outlinewiki/outline:${OUTLINE_VERSION}
    # Outline >= ~1.0 declares yarn@4.x in package.json which triggers
    # corepack. The image's default entrypoint already runs migrations +
    # start; the explicit `yarn ...` command below works only when corepack
    # is enabled, so we rely on the default entrypoint.
    environment:
      - DATABASE_URL=postgres://user:pass@wk-postgres:5432/outline
      - DATABASE_URL_TEST=postgres://user:pass@wk-postgres:5432/outline-test
      - REDIS_URL=redis://wk-redis:6379
      - AWS_S3_UPLOAD_BUCKET_NAME=outline-bucket
    env_file:
      - ./env.outline
      - ./env.oidc
    volumes:
      - ./data/outline:/var/lib/outline/data
    restart: always
    depends_on:
      wk-postgres:
        condition: service_healthy
      wk-redis:
        condition: service_healthy
##BEGIN MINIO
      wk-minio:
        condition: service_healthy
##END
      wk-oidc-server:
        condition: service_healthy
    networks:
      - ${NETWORKS}
    # Run the outline process as root inside the container. This is insecure
    # in general but useful for self-hosted debugging (e.g. `docker exec ...
    # apt-get install` or fixing broken volume permissions). Remove for
    # production deployments.
    user: 0:0
    healthcheck:
      # The outline image is Node-based and ships no `python`, so we use
      # `wget` (present in the image) to probe the HTTP server. A 2xx/3xx
      # response is enough: Outline's root redirects to /login when
      # unauthenticated, which is exactly the "app is up" signal we want.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  wk-oidc-server:
    image: vicalloy/oidc-server
    volumes:
      - ./config/uc/fixtures:/app/oidc_server/fixtures:z
      - ./data/uc/db:/app/db:z
      - ./data/uc/static_root:/app/static_root:z
    restart: always
    env_file:
      - ./env.oidc-server
    networks:
      - ${NETWORKS}
    healthcheck:
      # The oidc-server image is a slim Python image and may not include
      # `python` on PATH in some versions, so we use `wget` (always present
      # via busybox) to probe the HTTP server. Hitting the OIDC discovery
      # endpoint from inside the container requires FORCE_SCRIPT_NAME=/uc on
      # the inbound URL which is brittle, so we just probe the root — any
      # 2xx/3xx response means the WSGI server is bound and the app is
      # serving (correctness is exercised by the actual login flow).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  wk-nginx:
    image: nginx
    ports:
      - ${HTTP_IP}:${HTTP_PORT_IP}:80
    volumes:
      - ./config/nginx/:/etc/nginx/conf.d/:ro
      - ./data/uc/static_root:/uc/static_root:ro
    restart: always
    depends_on:
##BEGIN MINIO
      wk-minio:
        condition: service_healthy
##END
      wk-outline:
        condition: service_healthy
      wk-oidc-server:
        condition: service_healthy
    networks:
      - ${NETWORKS}
    logging:
      driver: none
networks:
  ${NETWORKS}:
    external: ${NETWORKS_EXTERNAL}
