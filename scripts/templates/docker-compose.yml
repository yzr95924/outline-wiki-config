services:
  wk-redis:
    image: redis:latest
    restart: always
    networks:
      - ${NETWORKS}
    logging:
      driver: none
  wk-postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - ${NETWORKS}
    logging:
      driver: none
##BEGIN MINIO
  wk-minio:
    image: minio/minio:${MINIO_VERSION}
    volumes:
      - ./data/minio_root:/minio_root:z
      - ./data/certs:/root/.minio/certs:z
    command: "minio server /minio_root"
    env_file:
      - ./env.minio
    restart: always
    networks:
      - ${NETWORKS}
    logging:
      driver: none
  wk-createbuckets:
    image: minio/mc:${MINIO_MC_VERSION}
    depends_on:
      - wk-minio
    env_file:
      - ./env.minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://wk-minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb minio/outline-bucket;
      /usr/bin/mc anonymous set download minio/outline-bucket;
      exit 0;
      "
    networks:
      - ${NETWORKS}
    logging:
      driver: none
##END
  wk-outline:
    image: outlinewiki/outline:${OUTLINE_VERSION}
    # Outline >= ~1.0 declares yarn@4.x in package.json which triggers
    # corepack. The image's default entrypoint already runs migrations +
    # start; the explicit `yarn ...` command below works only when corepack
    # is enabled, so we rely on the default entrypoint.
    environment:
      - DATABASE_URL=postgres://user:pass@wk-postgres:5432/outline
      - DATABASE_URL_TEST=postgres://user:pass@wk-postgres:5432/outline-test
      - REDIS_URL=redis://wk-redis:6379
      - AWS_S3_UPLOAD_BUCKET_NAME=outline-bucket
    env_file:
      - ./env.outline
      - ./env.oidc
    volumes:
      - ./data/outline:/var/lib/outline/data
    restart: always
    depends_on:
      - wk-postgres
      - wk-redis
##BEGIN MINIO
      - wk-minio
##END
    networks:
      - ${NETWORKS}
    # Run the outline process as root inside the container. This is insecure
    # in general but useful for self-hosted debugging (e.g. `docker exec ...
    # apt-get install` or fixing broken volume permissions). Remove for
    # production deployments.
    user: 0:0
    logging:
      driver: none
  wk-oidc-server:
    image: vicalloy/oidc-server
    volumes:
      - ./config/uc/fixtures:/app/oidc_server/fixtures:z
      - ./data/uc/db:/app/db:z
      - ./data/uc/static_root:/app/static_root:z
    restart: always
    env_file:
      - ./env.oidc-server
    networks:
      - ${NETWORKS}
    logging:
      driver: none
  wk-nginx:
    image: nginx
    ports:
      - ${HTTP_IP}:${HTTP_PORT_IP}:80
    volumes:
      - ./config/nginx/:/etc/nginx/conf.d/:ro
      - ./data/uc/static_root:/uc/static_root:ro
    restart: always
    depends_on:
##BEGIN MINIO
      - wk-minio
##END
      - wk-outline
      - wk-oidc-server
    networks:
      - ${NETWORKS}
    logging:
      driver: none
networks:
  ${NETWORKS}:
    external: ${NETWORKS_EXTERNAL}
