# Sample host-nginx front config for the "server behind a proxy" scenario
# (NETWORKS / NETWORKS_EXTERNAL in scripts/config.sh): TLS terminates here and
# traffic is forwarded to wk-nginx:80 over plain HTTP.
#
# The map below must live at http{} level. Files under the host nginx's
# conf.d/ are already in http context, so keeping map + server together as in
# this file works out of the box.

# WebSocket-aware Connection header: non-upgrade requests get Connection:
# close, real Upgrade requests get Connection: upgrade. Hardcoding
# Connection "upgrade" for ALL requests corrupts Node/koa upstream connection
# handling and intermittently triggers "upstream prematurely closed
# connection" (502) on slow requests such as the OIDC callback — the same bug
# already fixed in config/nginx/include/proxy.conf, do not reintroduce it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl http2;
    server_name wiki.domain.com;

    ssl_certificate /cert/domain.com/cert.pem;
    ssl_certificate_key /cert/domain.com/key.pem;

    # Match wk-nginx's limit (attachments up to 25MB; nginx default is 1m and
    # would reject larger uploads with 413 before they ever reach Outline).
    client_max_body_size 100m;

    location / {
        proxy_pass http://wk-nginx:80;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
