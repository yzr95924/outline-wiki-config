proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The outer connection to clients is HTTPS (terminated upstream of this
# nginx by ddnsto/reverse proxy). Hard-code X-Forwarded-Proto=https so that
# the downstream Outline/koa app sees an encrypted request and allows
# setting secure cookies (otherwise OIDC state CSRF cookie set fails
# with "Cannot send secure cookie over unencrypted connection").
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Host $http_host;

proxy_connect_timeout 300;
proxy_http_version 1.1;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
add_header Service-Worker-Allowed /;
