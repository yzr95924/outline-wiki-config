proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Pass the public-facing scheme to the upstream so it can decide on secure
# cookies etc. This server is fronted by ddnsto (HTTPS), which terminates
# TLS and forwards plain HTTP to us — so $scheme on our side is always
# "http" even when the original request was HTTPS. Hardcoding "https"
# here is required so Outline/OIDC server can set secure cookies.
# (ddnsto does not forward X-Forwarded-Proto, so a $real_scheme-style map
# would fall back to $scheme=http and break auth.)
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Host $http_host;

proxy_connect_timeout 300;
proxy_read_timeout 3600;
proxy_send_timeout 3600;
proxy_http_version 1.1;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
add_header Service-Worker-Allowed /;
