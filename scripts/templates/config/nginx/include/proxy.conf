proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Pass the public-facing scheme to the upstream so it can decide on secure
# cookies etc. `$real_scheme` (defined in default.conf) honors an
# X-Forwarded-Proto set by a TLS-terminating reverse proxy in front of us
# (ddnsto, host nginx, ELB, etc.) and falls back to the current
# connection's scheme for direct access.
proxy_set_header X-Forwarded-Proto $real_scheme;
proxy_set_header Host $http_host;

proxy_connect_timeout 300;
proxy_http_version 1.1;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
add_header Service-Worker-Allowed /;
