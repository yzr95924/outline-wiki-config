# Resolve the public-facing scheme for the request.
#
# When a TLS-terminating reverse proxy is in front of this nginx (ddnsto,
# host nginx with ssl-termination, ELB/ALB, Cloudflare, etc.), the proxy
# forwards over plain HTTP to us, so $scheme on our side is always "http"
# regardless of the original client protocol. To let Outline (and the OIDC
# server) know whether the *original* connection was HTTPS — which they
# need to decide whether to set secure cookies — we honor an
# X-Forwarded-Proto set by such a proxy and fall back to $scheme when
# there is no upstream (direct HTTP/HTTPS access).
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket-aware Connection header for upstreams. '' (non-upgrade) requests
# get Connection: close, real Upgrade requests get Connection: upgrade.
# Hardcoding Connection "upgrade" for all requests corrupts Node/koa upstream
# connection handling and intermittently triggers "upstream prematurely closed
# connection" (502) on slow/long requests such as the OIDC callback.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
  listen        80;
  client_max_body_size 100m;

##BEGIN MINIO 
  # Proxy requests to the bucket "outline" to MinIO server running on port 9000
  location /outline-bucket {
    include /etc/nginx/conf.d/include/proxy.conf;
    proxy_pass http://wk-minio:9000;
  }
##END

  # Outline Wiki
  location / {
    include /etc/nginx/conf.d/include/proxy.conf;
    proxy_pass http://wk-outline:3000;
  }

  # Static file FOR OIDC Server
  location /uc/static {
    alias /uc/static_root;
  }

  # OIDC Server
  location /uc {
    include /etc/nginx/conf.d/include/proxy.conf;
    proxy_set_header SCRIPT_NAME /uc;
    proxy_pass http://wk-oidc-server:8000;
  }
}
